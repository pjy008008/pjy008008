<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title description">
  <title id="title">개발자 박준유의 소개</title>
  <desc id="description">팀에서 문제가 생겼을 때 “쟤한테 가봐!”의 “쟤”가 되고 싶은 개발자 박준유입니다!</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="900" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151E2B" />
      <stop offset="1" stop-color="#0D141E" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="900" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#566A81" stop-opacity="0.6" />
      <stop offset="1" stop-color="#334255" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="34" x2="0" y2="156" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3B8CC" stop-opacity="0.8" />
      <stop offset="1" stop-color="#657C96" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="189" rx="16" fill="url(#surface)" stroke="url(#edge)" />
  <rect x="30" y="34" width="3" height="122" rx="1.5" fill="url(#accent)" />
  <g font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <text x="60" y="57" fill="#AEBCCD" font-size="25">팀에서 문제가 생겼을 때</text>
    <text x="60" y="104" fill="#F0F5FA" font-size="32"><tspan font-weight="700">“쟤한테 가봐!”의 “쟤”</tspan><tspan fill="#C4CFDD">가 되고 싶은</tspan></text>
    <text x="60" y="150" fill="#C4CFDD" font-size="26"><tspan fill="#EDF3F9" font-weight="700">개발자 박준유</tspan>입니다!</text>
  </g>
</svg>
