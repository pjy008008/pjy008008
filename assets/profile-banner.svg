<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title description">
  <title id="title">Junyou Park — Backend Developer</title>
  <desc id="description">어두운 네이비 배경 전체를 넓고 부드러운 청회색 빛이 왼쪽에서 오른쪽으로 가로지르는 박준유의 프로필 배너입니다. 이름과 직무는 고정되며 동작 줄이기 설정에서는 빛도 멈춥니다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D15" />
      <stop offset="0.5" stop-color="#101522" />
      <stop offset="1" stop-color="#0C1921" />
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#607995" stop-opacity="0.6" />
      <stop offset="0.5" stop-color="#46596F" stop-opacity="0.27" />
      <stop offset="1" stop-color="#46596F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#596779" stop-opacity="0.2" />
      <stop offset="0.5" stop-color="#435166" stop-opacity="0.04" />
      <stop offset="1" stop-color="#627B89" stop-opacity="0.16" />
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="260" rx="20" />
    </clipPath>
  </defs>
  <style>
    .background-light { animation: sweep-light 8s linear -2s infinite; }
    @keyframes sweep-light {
      from { transform: translateX(-1000px); }
      to { transform: translateX(1000px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .background-light { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#background)" />
    <ellipse class="background-light" cx="600" cy="130" rx="350" ry="600" fill="url(#light)" />
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="19.25" fill="none" stroke="url(#border)" stroke-width="1.5" />
  <text x="600" y="132" text-anchor="middle" fill="#F4F7FA" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">Junyou Park</text>
  <text x="600" y="184" text-anchor="middle" fill="#B8C9D3" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="1">Backend Developer</text>
</svg>
